name: Test basic inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy encrypted RSA key file
        run: |
          mkdir -p config
          # Create a dummy file that simulates an encrypted key
          # The action will fail at openssl decryption, but we verify inputs are accepted
          openssl enc -aes-256-cbc -md sha512 -salt -in /dev/null \
            -out config/deploy_id_rsa_enc -k "test-deploy-key" -a 2>/dev/null || \
            echo "dummy-encrypted-data" > config/deploy_id_rsa_enc
      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'test-deploy-key'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'
      - name: Assert action ran (not skipped) with valid inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail (not be skipped)
          # It will likely fail at bundle install / capistrano stage
          # but it should NOT be skipped — inputs were accepted
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with valid inputs (outcome=$OUTCOME)"
