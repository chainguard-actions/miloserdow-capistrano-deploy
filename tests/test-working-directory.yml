name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up working directory with dummy encrypted key
        run: |
          mkdir -p myapp/config
          echo "fakecontent" > myapp/config/deploy_id_rsa_enc

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'fake-deploy-key-for-testing'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'
          working-directory: 'myapp'

      - name: Assert action attempted execution with working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no real capistrano environment,
          # but it should have attempted to run with the specified working directory.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real capistrano environment), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected when using working-directory (no real deployment environment)"
