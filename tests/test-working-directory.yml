name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with a fake encrypted key file
        run: |
          mkdir -p myapp/config
          echo 'fake-encrypted-content' > myapp/config/deploy_id_rsa_enc

      - name: Run action with working-directory (will fail at openssl, not at validation)
        id: action
        uses: .
        with:
          capistrano_commands: '["deploy"]'
          deploy_key: 'some-deploy-key'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'
          working-directory: 'myapp'
        continue-on-error: true

      - name: Assert action proceeded past validation (failed at openssl/bundle)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at openssl (invalid key), not at the "file does not exist" check.
          # This confirms working-directory is correctly used to resolve the key path.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (openssl/bundle not available or key invalid)"
            exit 1
          fi
          echo "PASS: action correctly resolved key path relative to working-directory"
