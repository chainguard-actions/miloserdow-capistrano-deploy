name: Test missing encrypted RSA key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without enc_rsa_key_val and no key file, expect failure
        id: action
        uses: .
        with:
          capistrano_commands: '["deploy"]'
          deploy_key: 'some-deploy-key'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'
          # enc_rsa_key_val intentionally omitted and file does not exist
        continue-on-error: true

      - name: Assert action failed due to missing RSA key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when encrypted RSA key is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when encrypted RSA key is missing"
