name: Test missing RSA key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without RSA key file or value (expect failure)
        id: action
        uses: .
        with:
          bundler_version: '1.17.3'
          deploy_key: 'some-deploy-key'
          enc_rsa_key_pth: '/nonexistent/path/to/key'
          enc_rsa_key_val: ''
        continue-on-error: true
      - name: Assert action failed due to missing RSA key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no RSA key file or value is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when RSA key was not provided"
