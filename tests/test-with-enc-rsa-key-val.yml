name: Test with encrypted RSA key value provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          capistrano_commands: '["deploy"]'
          deploy_key: 'fake-deploy-key'
          enc_rsa_key_val: 'U2FsdGVkX1+fakeencryptedkeyvalue=='
      - name: Assert action failed at openssl decryption (not at key validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the encrypted key value is invalid for openssl,
          # not because the key file/value is missing. Either way, outcome should be failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (openssl decryption with fake key), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted decryption and failed on invalid key material"
