name: Test invalid encrypted key fails at decryption
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy (invalid) encrypted key file
        run: |
          mkdir -p config
          # This is not a valid AES-256-CBC encrypted file, so openssl will fail
          echo "this-is-not-a-valid-encrypted-key" > config/deploy_id_rsa_enc

      - name: Create a minimal Gemfile for bundler
        run: |
          cat > Gemfile <<'EOF'
          source 'https://rubygems.org'
          EOF
          cat > Gemfile.lock <<'EOF'
          GEM
            remote: https://rubygems.org/
            specs:

          PLATFORMS
            ruby

          DEPENDENCIES

          BUNDLED WITH
             1.17.3
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'test-deploy-key-12345'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'

      - name: Assert action failed due to invalid encrypted key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid encrypted key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when encrypted key is invalid"
