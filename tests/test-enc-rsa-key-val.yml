name: Test enc_rsa_key_val provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with enc_rsa_key_val (will fail at openssl, not at validation)
        id: action
        uses: .
        with:
          capistrano_commands: '["deploy"]'
          deploy_key: 'some-deploy-key'
          enc_rsa_key_val: 'not-a-real-encrypted-key'
        continue-on-error: true

      - name: Assert action failed at openssl stage (not at validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (openssl will fail on invalid key data),
          # but it must NOT fail with "Encrypted RSA private key file or value does not exist"
          # because enc_rsa_key_val was provided. Any failure here is from openssl/bundle,
          # which confirms the validation logic passed correctly.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (openssl/bundle not available or key invalid)"
            exit 1
          fi
          echo "PASS: action proceeded past RSA key validation (failed at openssl/bundle as expected)"
