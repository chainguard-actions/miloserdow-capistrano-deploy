name: Test custom capistrano commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          capistrano_commands: '["db:migrate", "deploy"]'
          target: 'staging'
          deploy_key: 'fake-deploy-key'
          enc_rsa_key_val: 'U2FsdGVkX1+fakeencryptedkeyvalue=='
      - name: Assert action failed at openssl (not at JSON parse or key validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at openssl decryption, meaning JSON parsing of
          # capistrano_commands succeeded and key validation passed (enc_rsa_key_val was set).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at openssl step, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly parsed custom commands and failed at decryption step"
