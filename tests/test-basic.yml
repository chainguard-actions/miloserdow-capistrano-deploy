name: Test basic usage - missing encrypted key file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action fails gracefully when encrypted key file is missing
        id: action
        uses: .
        with:
          target: staging
          deploy_key: my-secret-deploy-key
          enc_rsa_key_pth: config/deploy_id_rsa_enc
          working-directory: ''
        continue-on-error: true
      - name: Assert action failed (encrypted key file does not exist)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when encrypted key file is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when encrypted key file is missing"
