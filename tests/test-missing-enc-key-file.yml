name: Test missing encrypted key file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'some-deploy-key'
          enc_rsa_key_pth: 'config/nonexistent_enc_key'

      - name: Assert action failed when encrypted key file is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when encrypted key file does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when encrypted key file was not found"
