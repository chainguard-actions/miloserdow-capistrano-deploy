name: Test missing enc_rsa_key_pth fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'some-deploy-key'
          enc_rsa_key_pth: ''
      - name: Assert action failed due to missing enc_rsa_key_pth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when enc_rsa_key_pth is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when enc_rsa_key_pth was not provided"
