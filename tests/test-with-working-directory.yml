name: Test with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as working directory
        run: mkdir -p myapp
      - name: Test action with working-directory set
        id: action
        uses: .
        with:
          target: production
          deploy_key: test-deploy-key-value
          enc_rsa_key_pth: config/deploy_id_rsa_enc
          working-directory: myapp
        continue-on-error: true
      - name: Assert action failed (no encrypted key file in working directory)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when encrypted key file is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when encrypted key file is missing in working directory"
