name: Test missing deploy_key fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy encrypted key file so the action reaches the deploy_key check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/config"
          echo "dummy-encrypted-content" > "$GITHUB_WORKSPACE/config/deploy_id_rsa_enc"

      - id: action
        uses: .
        with:
          deploy_key: ''
          enc_rsa_key_pth: config/deploy_id_rsa_enc
        continue-on-error: true

      - name: Assert action failed due to missing deploy_key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deploy_key is empty, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when deploy_key was not provided"
