name: Test missing deploy_key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy encrypted key file
        run: |
          mkdir -p config
          echo "dummy-encrypted-content" > config/deploy_id_rsa_enc

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: ''
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'

      - name: Assert action failed when deploy_key is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deploy_key is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when deploy_key is missing"
