name: Test missing deploy key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without deploy_key and expect failure
        id: action
        uses: .
        with:
          capistrano_commands: '["deploy"]'
          deploy_key: ''
          enc_rsa_key_val: 'fake-encrypted-value'
        continue-on-error: true

      - name: Assert action failed due to missing deploy key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when deploy_key is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when deploy_key is missing"
