name: Test with target input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: staging
          deploy_key: dummy-deploy-key
          enc_rsa_key_pth: config/deploy_id_rsa_enc
      - name: Assert action ran with target input
        run: |
          echo "Action completed (with or without error) — target input was accepted"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the SSH/capistrano step since
          # there is no real encrypted key file or capistrano setup.
          # We only verify that the target input was passed without causing
          # an unexpected crash at the input-parsing level.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: target input was accepted and action ran"
