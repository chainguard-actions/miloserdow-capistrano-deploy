name: Test default enc_rsa_key_pth value is used
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Gemfile for bundler
        run: |
          cat > Gemfile <<'EOF'
          source 'https://rubygems.org'
          EOF
          cat > Gemfile.lock <<'EOF'
          GEM
            remote: https://rubygems.org/
            specs:

          PLATFORMS
            ruby

          DEPENDENCIES

          BUNDLED WITH
             1.17.3
          EOF

      - name: Verify default encrypted key path does not exist (to confirm default is used)
        run: |
          if [ -f "config/deploy_id_rsa_enc" ]; then
            echo "WARNING: default key file already exists, removing it"
            rm -f config/deploy_id_rsa_enc
          fi
          echo "Default key path 'config/deploy_id_rsa_enc' does not exist — action should fail at openssl"

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'test-deploy-key-12345'
          # enc_rsa_key_pth not provided — default 'config/deploy_id_rsa_enc' should be used

      - name: Assert action failed (default path file does not exist)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when default enc_rsa_key_pth file does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly used default enc_rsa_key_pth and failed as expected"
