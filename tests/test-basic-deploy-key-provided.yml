name: Test action starts with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy encrypted key file
        run: |
          mkdir -p config
          # Create a fake encrypted file (not a real AES-256-CBC encrypted key)
          echo "fakecontent" > config/deploy_id_rsa_enc

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: 'fake-deploy-key-for-testing'
          enc_rsa_key_pth: 'config/deploy_id_rsa_enc'

      - name: Assert action attempted execution (failed at system command, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the encrypted key is invalid (openssl will fail),
          # but it should NOT fail due to missing input validation.
          # Either way, the action is expected to fail in this test environment.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real capistrano environment), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (no real deployment environment available)"
